name: mobile_app
description: "Application mobile de pointage RH"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  geolocator: ^13.0.1
  geocoding: ^4.0.0
  camera: ^0.11.0+1
  path_provider: ^2.1.0
  intl: ^0.20.2
  provider: ^6.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_dotenv: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/dgrad.png"
  adaptive_icon_background: "#2563EB"
  adaptive_icon_foreground: "assets/dgrad.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env
